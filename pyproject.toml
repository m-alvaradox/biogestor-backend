[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
# Measure whole packages, not a hand-picked list: any new module under
# apps/ or config/ is measured automatically, even if no test imports it.
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
    "config/asgi.py",
    "config/wsgi.py",
]
# Paths relative to the repo root so diff-cover can match them with git diff.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
