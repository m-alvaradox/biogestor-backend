[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = [
    "apps.core.views",
    "apps.core.models",
    "apps.datasets.models",
    "apps.datasets.pagination",
    "apps.datasets.serializers",
    "apps.datasets.views",
    "apps.users.models",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
