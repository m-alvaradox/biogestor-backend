name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: biogestor
          POSTGRES_USER: biogestor
          POSTGRES_PASSWORD: ci-only-not-for-deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biogestor -d biogestor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: biogestor
      POSTGRES_USER: biogestor
      POSTGRES_PASSWORD: ci-only-not-for-deployment
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Verify migrations against clean PostgreSQL
        run: python manage.py migrate --noinput

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=70
