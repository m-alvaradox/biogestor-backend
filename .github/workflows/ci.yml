name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Cancela ejecuciones anteriores de la misma rama/PR cuando llega un nuevo push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Instalación, verificación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: biogestor
          POSTGRES_USER: biogestor
          POSTGRES_PASSWORD: ci-only-not-for-deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biogestor -d biogestor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: biogestor
      POSTGRES_USER: biogestor
      POSTGRES_PASSWORD: ci-only-not-for-deployment
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Primero las comprobaciones rápidas para fallar pronto.
      - name: Lint (Ruff)
        run: ruff check --output-format=github .

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q apps config manage.py

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Verify migrations against clean PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=70

      - name: Coverage summary
        if: always()
        run: |
          echo '### Cobertura' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Compilación de imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag biogestor-backend:ci .

      - name: Django check inside the image
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-only-not-for-deployment \
            -e DJANGO_DEBUG=true \
            biogestor-backend:ci python manage.py check

      - name: Smoke test /api/v1/health/
        run: |
          docker run -d --name backend -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-not-for-deployment \
            -e DJANGO_DEBUG=true \
            biogestor-backend:ci \
            gunicorn config.wsgi:application --bind 0.0.0.0:8000
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/; then
              echo; echo "Health check OK"; exit 0
            fi
            sleep 2
          done
          echo "El endpoint de salud no respondió"; docker logs backend; exit 1

      - name: Stop container
        if: always()
        run: docker rm -f backend || true
